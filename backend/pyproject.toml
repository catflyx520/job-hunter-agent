[project]
name = "job-hunter-agent"
version = "0.1.0"
description = "Open-source, local-first job hunting assistant"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "cryptography>=43",
  "httpx>=0.27",
  "openai>=1.55",
  "anthropic>=0.40",
  "pdfplumber>=0.11",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.17",
  "langgraph>=0.2.50",
  "openpyxl>=3.1.5",
  "pillow>=13.0.0",
  "certifi>=2026.10.23",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "reportlab>=4.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
