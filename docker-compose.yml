# 只用来跑数据库：Postgres 16 + pgvector。app（后端与前端）直接在本机执行，见 README。
# 启动：docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports:
      - "127.0.0.1:5433:5432"   # 只开放给本机
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
